name: Compare Prod Canister Hashes

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    compare-hashes:
        runs-on: ubuntu-latest
        env:
            BACKEND_CANISTER_NAMES: 'indicator dao axioms encyclopedia chat facade escrow sales split treasury affiliate assets icpusd'
            NODE_VERSION: '20'

        steps:
            - name: Checkout PR Code (Initial)
              uses: actions/checkout@v4

            - name: Setup DFX
              uses: dfinity/setup-dfx@main
              with:
                  dfx-version: 0.29.0

            - name: Setup DFX 0.26.0
              uses: dfinity/setup-dfx@main
              with:
                  dfx-version: 0.26.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            # Base Branch Processing
            - name: Base Branch - Checkout Code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base
                  persist-credentials: false

            - name: Base Branch - Install Dependencies
              working-directory: ./base
              run: |
                  dfx start --clean --background
                  echo "Waiting for replica to start..."
                  sleep 15
                  yarn install --frozen-lockfile
                  yarn global add ic-mops@1.5.0
                  echo "PATH=$PATH"
                  echo "DFX_PATH=$(which dfx)"
                  which dfx
                  dfx cache install
                  mops install
                  dfx --version
                  mops --version

            - name: Base Branch - Prepare and Analyze
              working-directory: ./base
              id: base_prepare
              continue-on-error: true
              run: |
                  # Run migrate script to prepare backend_prod
                  echo "Running migrate script..."
                  yarn migrate || echo "::warning::Base migrate failed."

                  # Create directory for hash storage
                  mkdir -p .wasm_hashes

            - name: Base Branch - Try to Deploy and Extract Hashes
              working-directory: ./base
              id: base_build
              continue-on-error: true
              run: |
                  # Create the canisters first
                  echo "Creating canisters..."
                  for canister in $BACKEND_CANISTER_NAMES; do
                    dfx canister create ${canister}_prod || echo "::warning::Failed to create ${canister}_prod"
                  done

                  # Deploy dependency canisters
                  echo "Deploying dependencies..."
                  ./scripts/bash/deploy_icp.sh || echo "::warning::Failed to deploy ICP"
                  dfx deploy internet_identity --mode=reinstall --yes || echo "::warning::Failed to deploy internet_identity"
                  dfx deploy xrc --specified-id=uf6dk-hyaaa-aaaaq-qaaaq-cai --mode=reinstall --yes || echo "::warning::Failed to deploy xrc"

                  # Try to build each canister individually without deploying to collect hashes
                  echo "Building canisters to collect hashes..."
                  for canister in $BACKEND_CANISTER_NAMES; do
                    canister_name="${canister}_prod"
                    echo "Building $canister_name..."
                    
                    if dfx build "$canister_name"; then
                      WASM_PATH=".dfx/local/canisters/$canister_name/$canister_name.wasm"
                      
                      if [ -f "$WASM_PATH" ]; then
                        HASH=$(sha256sum "$WASM_PATH" | cut -d ' ' -f1)
                        echo "Generated hash for $canister_name: $HASH"
                        echo "$HASH" > ".wasm_hashes/$canister_name.hash"
                        
                        CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                        echo "BASE_HASH_${CANISTER_ENV_NAME}=$HASH" >> $GITHUB_ENV
                      else
                        echo "::warning::WASM file not found for $canister_name at $WASM_PATH"
                        CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                        echo "BASE_HASH_ERROR_${CANISTER_ENV_NAME}=true" >> $GITHUB_ENV
                      fi
                    else
                      echo "::warning::Failed to build $canister_name"
                      CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                      echo "BASE_HASH_ERROR_${CANISTER_ENV_NAME}=true" >> $GITHUB_ENV
                    fi
                  done

            # PR Branch Processing
            - name: PR Branch - Checkout Code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: pr
                  persist-credentials: false

            - name: PR Branch - Install Dependencies
              working-directory: ./pr
              run: |
                  dfx stop || true
                  sudo killall -9 dfx replica pocket-ic || true

                  sed -i 's/127.0.0.1:4943/127.0.0.1:5943/g' dfx.json

                  dfx start --clean --background
                  echo "Waiting for replica to start..."
                  sleep 15
                  yarn install --frozen-lockfile
                  yarn global add ic-mops@1.5.0
                  echo "PATH=$PATH"
                  echo "DFX_PATH=$(which dfx)"
                  which dfx
                  dfx cache install
                  mops install
                  dfx --version
                  mops --version

            - name: PR Branch - Prepare and Analyze
              working-directory: ./pr
              id: pr_prepare
              continue-on-error: true
              run: |
                  # Run migrate script to prepare backend_prod
                  echo "Running migrate script..."
                  yarn migrate || echo "::warning::PR migrate failed."

                  # Create directory for hash storage
                  mkdir -p .wasm_hashes

            - name: PR Branch - Try to Deploy and Extract Hashes
              working-directory: ./pr
              id: pr_build
              continue-on-error: true
              run: |
                  # Create the canisters first
                  echo "Creating canisters..."
                  for canister in $BACKEND_CANISTER_NAMES; do
                    dfx canister create ${canister}_prod || echo "::warning::Failed to create ${canister}_prod"
                  done

                  # Deploy dependency canisters
                  echo "Deploying dependencies..."
                  ./scripts/bash/deploy_icp.sh || echo "::warning::Failed to deploy ICP"
                  dfx deploy internet_identity --mode=reinstall --yes || echo "::warning::Failed to deploy internet_identity"
                  dfx deploy xrc --specified-id=uf6dk-hyaaa-aaaaq-qaaaq-cai --mode=reinstall --yes || echo "::warning::Failed to deploy xrc"

                  # Create directories for changed and unchanged wasms
                  mkdir -p wasm_artifacts/changed
                  mkdir -p wasm_artifacts/unchanged

                  # Try to build each canister individually without deploying to collect hashes
                  echo "Building canisters to collect hashes..."
                  for canister in $BACKEND_CANISTER_NAMES; do
                    canister_name="${canister}_prod"
                    echo "Building $canister_name..."
                    
                    if dfx build "$canister_name"; then
                      WASM_PATH=".dfx/local/canisters/$canister_name/$canister_name.wasm"
                      
                      if [ -f "$WASM_PATH" ]; then
                        HASH=$(sha256sum "$WASM_PATH" | cut -d ' ' -f1)
                        echo "Generated hash for $canister_name: $HASH"
                        echo "$HASH" > ".wasm_hashes/$canister_name.hash"
                        
                        CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                        echo "PR_HASH_${CANISTER_ENV_NAME}=$HASH" >> $GITHUB_ENV
                        echo "PR_BUILD_SUCCESS_${CANISTER_ENV_NAME}=true" >> $GITHUB_ENV
                        
                        # Compare with base hash to determine if changed or unchanged
                        BASE_HASH_VAR="BASE_HASH_${CANISTER_ENV_NAME}"
                        BASE_HASH="${!BASE_HASH_VAR:-}"
                        
                        # Determine if hash has changed and copy to appropriate folder
                        if [[ "$BASE_HASH" == "$HASH" ]]; then
                          echo "WASM_${CANISTER_ENV_NAME}_STATUS=unchanged" >> $GITHUB_ENV
                          cp "$WASM_PATH" "wasm_artifacts/unchanged/${canister_name}.wasm"
                        else
                          echo "WASM_${CANISTER_ENV_NAME}_STATUS=updated" >> $GITHUB_ENV
                          cp "$WASM_PATH" "wasm_artifacts/changed/${canister_name}.wasm"
                        fi
                      else
                        echo "::warning::WASM file not found for $canister_name at $WASM_PATH"
                        CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                        echo "PR_HASH_ERROR_${CANISTER_ENV_NAME}=true" >> $GITHUB_ENV
                      fi
                    else
                      echo "::warning::Failed to build $canister_name"
                      CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                      echo "PR_HASH_ERROR_${CANISTER_ENV_NAME}=true" >> $GITHUB_ENV
                    fi
                  done

            # Check stable compatibility between base and PR (only for changed canisters)
            - name: Check Stable Compatibility
              id: check_compatibility
              continue-on-error: true
              run: |
                  MOC_PATH="$(dfx cache show)/moc"
                  echo "Using moc at: $MOC_PATH"
                  
                  # Create empty file to store compatibility errors (truly empty, no newline)
                  > /tmp/compatibility_errors.txt
                  COMPAT_ERROR_COUNT=0
                  
                  for canister in $BACKEND_CANISTER_NAMES; do
                    canister_name="${canister}_prod"
                    CANISTER_ENV_NAME=$(echo "${canister}" | tr '[:lower:]' '[:upper:]')
                    
                    # Only check compatibility for changed canisters
                    WASM_STATUS_VAR="WASM_${CANISTER_ENV_NAME}_STATUS"
                    WASM_STATUS="${!WASM_STATUS_VAR:-}"
                    
                    if [[ "$WASM_STATUS" != "updated" ]]; then
                      echo "Skipping $canister_name - not changed (status: $WASM_STATUS)"
                      continue
                    fi
                    
                    BASE_MOST="base/.dfx/local/canisters/$canister_name/$canister_name.most"
                    PR_MOST="pr/.dfx/local/canisters/$canister_name/$canister_name.most"
                    
                    echo "Checking compatibility for $canister_name..."
                    
                    # Check if both .most files exist
                    if [ ! -f "$BASE_MOST" ]; then
                      echo "COMPAT_${CANISTER_ENV_NAME}=skip" >> $GITHUB_ENV
                      echo "⏭️ $canister_name - Base .most file not found"
                      continue
                    fi
                    
                    if [ ! -f "$PR_MOST" ]; then
                      echo "COMPAT_${CANISTER_ENV_NAME}=skip" >> $GITHUB_ENV
                      echo "⏭️ $canister_name - PR .most file not found"
                      continue
                    fi
                    
                    # Run moc --stable-compatible and capture output
                    if COMPAT_OUTPUT=$("$MOC_PATH" --stable-compatible "$BASE_MOST" "$PR_MOST" 2>&1); then
                      echo "COMPAT_${CANISTER_ENV_NAME}=success" >> $GITHUB_ENV
                      echo "✅ $canister_name is stable compatible"
                    else
                      echo "COMPAT_${CANISTER_ENV_NAME}=fail" >> $GITHUB_ENV
                      echo "❌ $canister_name is NOT stable compatible"
                      echo "Error: $COMPAT_OUTPUT"
                      
                      # Store error for later use
                      echo "### $canister_name" >> /tmp/compatibility_errors.txt
                      echo '```' >> /tmp/compatibility_errors.txt
                      echo "$COMPAT_OUTPUT" >> /tmp/compatibility_errors.txt
                      echo '```' >> /tmp/compatibility_errors.txt
                      echo "" >> /tmp/compatibility_errors.txt
                      
                      COMPAT_ERROR_COUNT=$((COMPAT_ERROR_COUNT + 1))
                    fi
                  done
                  
                  # Store compatibility errors content only if there are actual errors
                  if [ "$COMPAT_ERROR_COUNT" -gt 0 ]; then
                    echo "HAS_COMPAT_ERRORS=true" >> $GITHUB_ENV
                    # Store errors in a file that can be read later
                    cp /tmp/compatibility_errors.txt pr/compatibility_errors.txt
                  else
                    echo "HAS_COMPAT_ERRORS=false" >> $GITHUB_ENV
                  fi

            # Upload WASM artifacts - changed folder
            - name: Upload Changed WASMs
              uses: actions/upload-artifact@v4
              if: ${{ hashFiles('pr/wasm_artifacts/changed/*.wasm') != '' }}
              with:
                  name: changed
                  path: pr/wasm_artifacts/changed/
                  retention-days: 8

            # Upload WASM artifacts - unchanged folder
            - name: Upload Unchanged WASMs
              uses: actions/upload-artifact@v4
              if: ${{ hashFiles('pr/wasm_artifacts/unchanged/*.wasm') != '' }}
              with:
                  name: unchanged
                  path: pr/wasm_artifacts/unchanged/
                  retention-days: 8

            - name: Stop DFX Replica
              if: always()
              run: dfx stop || true

            # Generate and post comparison results
            - name: Generate Hash Comparison Data
              id: comparison_data
              run: |
                  declare -A changed_items
                  declare -A unchanged_items
                  declare -A error_items
                  HAS_ERRORS=false
                  ERROR_SECTION=""
                  CURRENT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
                  PR_COMMIT="${{ github.event.pull_request.head.sha }}"
                  BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
                  REPO_URL="${{ github.server_url }}/${{ github.repository }}"
                  ARTIFACT_BASE_URL="${REPO_URL}/actions/runs/${{ github.run_id }}#artifacts"

                  # Map of canister names to actor names and directory locations
                  declare -A ACTOR_NAMES
                  declare -A DIRECTORY_PATHS

                  ACTOR_NAMES["indicator_prod"]="Indicator"
                  DIRECTORY_PATHS["indicator_prod"]="backend/canisters/periphery/indicator"

                  ACTOR_NAMES["dao_prod"]="DAO"
                  DIRECTORY_PATHS["dao_prod"]="backend/canisters/periphery/dao"

                  ACTOR_NAMES["axioms_prod"]="Axioms"
                  DIRECTORY_PATHS["axioms_prod"]="backend/canisters/core/axioms"

                  ACTOR_NAMES["encyclopedia_prod"]="Encyclopedia"
                  DIRECTORY_PATHS["encyclopedia_prod"]="backend/canisters/core/encyclopedia"

                  ACTOR_NAMES["chat_prod"]="Chat"
                  DIRECTORY_PATHS["chat_prod"]="backend/canisters/core/chat"

                  ACTOR_NAMES["facade_prod"]="Facade"
                  DIRECTORY_PATHS["facade_prod"]="backend/canisters/periphery/facade"

                  ACTOR_NAMES["escrow_prod"]="Escrow"
                  DIRECTORY_PATHS["escrow_prod"]="backend/canisters/core/escrow"

                  ACTOR_NAMES["sales_prod"]="Sales"
                  DIRECTORY_PATHS["sales_prod"]="backend/canisters/core/sales"

                  ACTOR_NAMES["split_prod"]="Split"
                  DIRECTORY_PATHS["split_prod"]="backend/canisters/core/split"

                  ACTOR_NAMES["treasury_prod"]="Treasury"
                  DIRECTORY_PATHS["treasury_prod"]="backend/canisters/core/treasury"

                  ACTOR_NAMES["affiliate_prod"]="Affiliate"
                  DIRECTORY_PATHS["affiliate_prod"]="backend/canisters/core/affiliate"

                  ACTOR_NAMES["assets_prod"]="Assets"
                  DIRECTORY_PATHS["assets_prod"]="backend/canisters/core/assets"

                  ACTOR_NAMES["icpusd_prod"]="ICPUSD"
                  DIRECTORY_PATHS["icpusd_prod"]="backend/canisters/core/icpusd"

                  if [[ "${{ steps.base_prepare.outcome }}" == 'failure' ]]; then
                    ERROR_SECTION+="**🚨 Error (Base):** Failed during migrate or analyze:prod preparation step.\n\n"
                    HAS_ERRORS=true
                  elif [[ "${{ steps.base_prepare.outcome }}" == 'skipped' ]]; then
                    ERROR_SECTION+="**⚠️ Warning (Base):** Preparation step skipped.\n\n"
                  fi

                  if [[ "${{ steps.pr_prepare.outcome }}" == 'failure' ]]; then
                    ERROR_SECTION+="**🚨 Error (PR):** Failed during migrate or analyze:prod preparation step.\n\n"
                    HAS_ERRORS=true
                  elif [[ "${{ steps.pr_prepare.outcome }}" == 'skipped' ]]; then
                     ERROR_SECTION+="**⚠️ Warning (PR):** Preparation step skipped.\n\n"
                  fi

                  ALL_ITEMS=($(echo "$BACKEND_CANISTER_NAMES" | tr '[:lower:]' '[:upper:]'))

                  for item in "${ALL_ITEMS[@]}"; do
                    BASE_HASH_VAR="BASE_HASH_$item"
                    PR_HASH_VAR="PR_HASH_$item"
                    BASE_ERR_VAR="BASE_HASH_ERROR_$item"
                    PR_ERR_VAR="PR_HASH_ERROR_$item"
                    PR_SUCCESS_VAR="PR_BUILD_SUCCESS_$item"
                    COMPAT_VAR="COMPAT_$item"

                    CANISTER_NAME="$(echo "$item" | tr '[:upper:]' '[:lower:]')_prod"
                    
                    ACTOR_NAME="${ACTOR_NAMES[$CANISTER_NAME]}"
                    DIR_PATH="${DIRECTORY_PATHS[$CANISTER_NAME]}"
                    
                    # Create links to exact files in the PR and base commits
                    PR_DIR_URL="${REPO_URL}/blob/${PR_COMMIT}/${DIR_PATH}"
                    BASE_DIR_URL="${REPO_URL}/blob/${BASE_COMMIT}/${DIR_PATH}"
                    PROD_DIR_PATH="${DIR_PATH/backend/backend_prod}"
                    PR_PROD_DIR_URL="${REPO_URL}/blob/${PR_COMMIT}/${PROD_DIR_PATH}"
                    
                    DIRECTORY_INFO="[dev](${PR_DIR_URL}) / [prod](${PR_PROD_DIR_URL})"

                    BASE_HASH="${!BASE_HASH_VAR:-}"
                    PR_HASH="${!PR_HASH_VAR:-}"
                    BASE_ERR="${!BASE_ERR_VAR:-false}"
                    PR_ERR="${!PR_ERR_VAR:-false}"
                    PR_SUCCESS="${!PR_SUCCESS_VAR:-false}"
                    COMPAT_STATUS="${!COMPAT_VAR:-skip}"

                    # Determine compatibility icon
                    if [[ "$COMPAT_STATUS" == "success" ]]; then
                      COMPAT_ICON="✅"
                    elif [[ "$COMPAT_STATUS" == "fail" ]]; then
                      COMPAT_ICON="❌"
                    else
                      COMPAT_ICON="⏭️"
                    fi

                    # Determine status for artifact naming
                    if [[ "$BASE_HASH" == "$PR_HASH" ]]; then
                      STATUS="unchanged"
                    else
                      STATUS="changed"
                    fi

                    HAS_BASE_ISSUE=false
                    if [[ "$BASE_ERR" == "true" ]] || [[ -z "$BASE_HASH" ]]; then
                      HAS_BASE_ISSUE=true
                    fi

                    HAS_PR_ISSUE=false
                    if [[ "$PR_ERR" == "true" ]] || [[ -z "$PR_HASH" ]]; then
                      HAS_PR_ISSUE=true
                    fi

                    if [[ "$HAS_BASE_ISSUE" == "true" ]] || [[ "$HAS_PR_ISSUE" == "true" ]]; then
                      error_items[$CANISTER_NAME]="base_error:$HAS_BASE_ISSUE,pr_error:$HAS_PR_ISSUE,directory:$DIRECTORY_INFO,actor:$ACTOR_NAME"
                      HAS_ERRORS=true # Mark overall errors if any specific item had an issue
                    elif [[ "$BASE_HASH" == "$PR_HASH" ]]; then
                      unchanged_items[$CANISTER_NAME]="hash:$PR_HASH,directory:$DIRECTORY_INFO,actor:$ACTOR_NAME"
                    else
                      changed_items[$CANISTER_NAME]="base:$BASE_HASH,pr:$PR_HASH,directory:$DIRECTORY_INFO,actor:$ACTOR_NAME,compat:$COMPAT_ICON"
                    fi
                  done

                  # Generate tables
                  BUILD_FAILURES_TABLE=""
                  CHANGED_TABLE=""
                  UNCHANGED_TABLE=""
                  ERROR_DETAILS="" # For general error messages
                  COMPAT_ERRORS_SECTION=""

                  if [[ ${#error_items[@]} -gt 0 ]]; then
                    BUILD_FAILURES_TABLE="### 🚨 Build Failures (${#error_items[@]})"$'\n\n'
                    BUILD_FAILURES_TABLE+="| Actor | Base Status | PR Status | Directory |"$'\n'
                    BUILD_FAILURES_TABLE+="|:---------:|:------------:|:----------:|:----------:|"$'\n'

                    for name in $(echo "${!error_items[@]}" | tr ' ' '\n' | sort); do
                      errors=${error_items[$name]}
                      base_status="✅ Success"
                      if [[ "$errors" == *"base_error:true"* ]]; then
                        base_status="❌ Failed"
                      fi
                      pr_status="✅ Success"
                      if [[ "$errors" == *"pr_error:true"* ]]; then
                        pr_status="❌ Failed"
                      fi
                      directory=$(echo "$errors" | sed 's/.*directory:\([^,]*\).*/\1/')
                      actor_name=$(echo "$errors" | sed 's/.*actor:\([^,]*\).*/\1/')
                      
                      BUILD_FAILURES_TABLE+="| $actor_name | $base_status | $pr_status | $directory |"$'\n'
                    done
                    BUILD_FAILURES_TABLE+=$'\n'
                  fi

                  if [[ ${#changed_items[@]} -gt 0 ]]; then
                    CHANGED_TABLE="### ⚠️ Changed Module Hashes (${#changed_items[@]})"$'\n\n'
                    CHANGED_TABLE+="| Actor | Compatible | Base Hash | PR Hash | Directory |"$'\n'
                    CHANGED_TABLE+="|:---------:|:----------:|:----------:|:--------:|:----------:|"$'\n'

                    for name in $(echo "${!changed_items[@]}" | tr ' ' '\n' | sort); do
                      item_data=${changed_items[$name]}
                      base_hash=$(echo "$item_data" | sed 's/.*base:\([^,]*\).*/\1/')
                      pr_hash=$(echo "$item_data" | sed 's/.*pr:\([^,]*\).*/\1/')
                      directory=$(echo "$item_data" | sed 's/.*directory:\([^,]*\).*/\1/')
                      actor_name=$(echo "$item_data" | sed 's/.*actor:\([^,]*\).*/\1/')
                      compat_icon=$(echo "$item_data" | sed 's/.*compat:\([^,]*\).*/\1/')
                      
                      CHANGED_TABLE+="| $actor_name | $compat_icon | \`$base_hash\` | \`$pr_hash\` | $directory |"$'\n'
                    done
                    CHANGED_TABLE+=$'\n'
                  fi

                  if [[ ${#unchanged_items[@]} -gt 0 ]]; then
                    UNCHANGED_TABLE="### ✅ Unchanged Module Hashes (${#unchanged_items[@]})"$'\n\n'
                    UNCHANGED_TABLE+="| Actor | Hash | Directory |"$'\n'
                    UNCHANGED_TABLE+="|:---------:|:-----:|:----------:|"$'\n'

                    for name in $(echo "${!unchanged_items[@]}" | tr ' ' '\n' | sort); do
                      item_data=${unchanged_items[$name]}
                      hash=$(echo "$item_data" | sed 's/.*hash:\([^,]*\).*/\1/')
                      directory=$(echo "$item_data" | sed 's/.*directory:\([^,]*\).*/\1/')
                      actor_name=$(echo "$item_data" | sed 's/.*actor:\([^,]*\).*/\1/')
                      
                      UNCHANGED_TABLE+="| $actor_name | \`$hash\` | $directory |"$'\n'
                    done
                    UNCHANGED_TABLE+=$'\n'
                  fi

                  # In case no successful builds
                  if [[ ${#changed_items[@]} -eq 0 ]] && [[ ${#unchanged_items[@]} -eq 0 ]]; then
                    if [[ $HAS_ERRORS == true ]]; then
                      if [[ -z "$BUILD_FAILURES_TABLE" ]]; then
                        ERROR_DETAILS+="### 🚨 Build Status: No successful builds"$'\n\n'
                        ERROR_DETAILS+="No canisters were successfully built and compared. Please check the workflow logs for more information."$'\n\n'
                      fi
                    else
                      ERROR_DETAILS+="### 🚨 Build Status: No successful builds"$'\n\n'
                      ERROR_DETAILS+="No canisters were successfully built and compared. Please check the workflow logs for more information."$'\n\n'
                    fi
                  fi

                  # Add note about artifact ZIP files and hash differences
                  ARTIFACT_SECTION="*[View built WASM files](${ARTIFACT_BASE_URL}) (note that the displayed \`sha256:...\` hashes **WILL NOT** match the module hash, as the files are compressed into a zip archive)*\n\n"

                  # Add compatibility errors section if there are any
                  if [[ "$HAS_COMPAT_ERRORS" == "true" ]] && [[ -f "pr/compatibility_errors.txt" ]]; then
                    COMPAT_ERRORS_CONTENT=$(cat pr/compatibility_errors.txt)
                    COMPAT_ERRORS_SECTION="<details>\n<summary>❌ Stable Compatibility Errors (click to expand)</summary>\n\n$COMPAT_ERRORS_CONTENT\n</details>\n\n"
                  fi

                  FINAL_ERROR_SECTION="${ERROR_SECTION}${ERROR_DETAILS}"

                  # Export all components for comment assembly
                  EOF_MARKER=$(mktemp -u EEEEEEXXXXXX)
                  echo "error_section<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$FINAL_ERROR_SECTION" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  EOF_MARKER=$(mktemp -u BBBBBBXXXXXX)
                  echo "build_failures_table<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$BUILD_FAILURES_TABLE" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  EOF_MARKER=$(mktemp -u CCCCCCCXXXXX)
                  echo "changed_table<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$CHANGED_TABLE" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  EOF_MARKER=$(mktemp -u UUUUUUUXXXXX)
                  echo "unchanged_table<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$UNCHANGED_TABLE" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  EOF_MARKER=$(mktemp -u AAAAAAAXXXX)
                  echo "artifact_section<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$ARTIFACT_SECTION" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  EOF_MARKER=$(mktemp -u XXXXXXXXYYY)
                  echo "compat_errors_section<<$EOF_MARKER" >> $GITHUB_OUTPUT
                  echo -e "$COMPAT_ERRORS_SECTION" >> $GITHUB_OUTPUT
                  echo "$EOF_MARKER" >> $GITHUB_OUTPUT

                  echo "has_errors=$HAS_ERRORS" >> $GITHUB_OUTPUT
                  echo "has_compat_errors=$HAS_COMPAT_ERRORS" >> $GITHUB_OUTPUT
                  echo "changed_items_count=${#changed_items[@]}" >> $GITHUB_OUTPUT
                  echo "unchanged_items_count=${#unchanged_items[@]}" >> $GITHUB_OUTPUT
                  echo "error_items_count=${#error_items[@]}" >> $GITHUB_OUTPUT
                  echo "current_date=$CURRENT_DATE" >> $GITHUB_OUTPUT
                  echo "current_user=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT

                  # Debug output
                  echo "Debug: Build Failures=${#error_items[@]}, Changed=${#changed_items[@]}, Unchanged=${#unchanged_items[@]}, HasErrors=$HAS_ERRORS, HasCompatErrors=$HAS_COMPAT_ERRORS"

            - name: Post or Update Comment
              uses: peter-evans/create-or-update-comment@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-id: 'canister-hash-comparison-${{ github.event.pull_request.number }}'
                  edit-mode: replace
                  body: |
                      ## 📦 Canister Module Hashes Comparison

                      **PR:** [#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})
                      **Author:** [@${{ steps.comparison_data.outputs.current_user }}](${{ github.event.pull_request.user.html_url }})

                      ${{ steps.comparison_data.outputs.error_section != '' && steps.comparison_data.outputs.error_section || '' }}

                      ${{ steps.comparison_data.outputs.build_failures_table != '' && steps.comparison_data.outputs.build_failures_table || '' }}

                      ${{ steps.comparison_data.outputs.changed_table != '' && steps.comparison_data.outputs.changed_table || '' }}

                      ${{ steps.comparison_data.outputs.unchanged_table != '' && steps.comparison_data.outputs.unchanged_table || '' }}

                      ${{ steps.comparison_data.outputs.changed_items_count == 0 && steps.comparison_data.outputs.unchanged_items_count > 0 && steps.comparison_data.outputs.has_errors == 'false' && '✅ *All successfully compared canister module hashes remained the same.*' || '' }}

                      ${{ steps.comparison_data.outputs.artifact_section != '' && steps.comparison_data.outputs.artifact_section || '' }}

                      ${{ steps.comparison_data.outputs.compat_errors_section != '' && steps.comparison_data.outputs.compat_errors_section || '' }}
